version: 2
updates:
  - package-ecosystem: docker
    directory: /
    target-branch: pre-develop
    schedule:
      interval: weekly
    groups:
      imagens:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /
    target-branch: pre-develop
    schedule:
      interval: weekly
    groups:
      dependencias:
        patterns: ["*"]
        update-types: ["minor", "patch"]
