# Cabeçalhos de segurança. O add_header de uma location anula os do server, então toda location
# que define o seu próprio inclui este arquivo.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
# style-src 'unsafe-inline': a cor da Empresa entra num <style> criado em tempo de execução.
# Google Fonts e blob: só para a prévia do reward (fontes da janela e a imagem escolhida).
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
