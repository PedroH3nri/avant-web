# Serve o build do Vite. Qualquer caminho sem arquivo cai no index.html (rotas do Vue).
# Os tokens de convite e de nova senha vão na URL (/convite/<token>, /redefinir-senha/<token> e
# /api/v1/auth/invitations/<token>) e no Referer das chamadas seguintes: o access_log usa este
# formato, que grava *** no lugar deles. Igual ao nginx/vm.conf do avant-infra.
map $request $avant_log_request {
    "~^(?<token_prefix>.*?/(?:api/v1/auth/invitations|convite|redefinir-senha)/)[^/?#\s]+(?<token_suffix>.*)$" "${token_prefix}***${token_suffix}";
    default $request;
}
map $http_referer $avant_log_referer {
    "~^(?<token_prefix>.*?/(?:api/v1/auth/invitations|convite|redefinir-senha)/)[^/?#\s]+(?<token_suffix>.*)$" "${token_prefix}***${token_suffix}";
    default $http_referer;
}
log_format avant_redacted '$remote_addr - $remote_user [$time_local] "$avant_log_request" '
                          '$status $body_bytes_sent "$avant_log_referer" "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /var/log/nginx/access.log avant_redacted;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        expires 1y;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Os scripts da ad tag e do reward rodam no site do cliente: qualquer origem pode carregar,
    # cache curto (o nome não tem hash, então uma versão nova chega em até 10 minutos).
    location ~ ^/(tag|reward)\.js$ {
        add_header Cache-Control "public, max-age=600" always;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # O /api é do avant-api; se chegar aqui, é erro de roteamento.
    location /api/ {
        return 404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
